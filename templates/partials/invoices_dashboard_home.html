<!-- invoices/dashboard_home.html -->
<div id="welcome-screen" class="text-center container" style="margin-top: 8vh;">
    <i class="bi bi-speedometer2 text-primary" style="font-size: clamp(2.5rem, 10vw, 4rem);"></i>
    
    <h2 class="mt-3 fw-bold" style="font-size: clamp(1.5rem, 5vw, 2rem);">Welcome to the Dashboard</h2>
    <p class="text-muted px-3">Select a module from the sidebar to manage your invoices and clients.</p>
    
    <!-- Using Bootstrap Row/Col for perfect responsiveness -->
    <div class="row g-3 justify-content-center mt-4 mx-auto" style="max-width: 900px;">
        
        <!-- Invoice Card -->
        <div class="col-12 col-sm-6 col-md-4">
            <div class="p-4 bg-white border rounded shadow-sm h-100">
                <h3 class="text-primary fw-bold">{{ invoice_count|default:"0" }}</h3>
                <span class="text-muted d-block">Invoices</span>
            </div>
        </div>

        <!-- Client Card -->
        <div class="col-12 col-sm-6 col-md-4">
            <div class="p-4 bg-white border rounded shadow-sm h-100">
                <h3 class="text-success fw-bold">{{ client_count|default:"0" }}</h3>
                <span class="text-muted d-block">Clients</span>
            </div>
        </div>

        <!-- Pending Card -->
        <div class="col-12 col-sm-6 col-md-4">
            <div class="p-4 bg-white border rounded shadow-sm h-100">
                <h3 class="text-danger fw-bold">{{ pending_count|default:"0" }}</h3>
                <span class="text-muted d-block">Due & pending</span>
            </div>
        </div>

    </div>
</div>
